spring:
  datasource:
    url: jdbc:h2:mem:leadflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

flyway:
  enabled: false

jwt:
  secret: ${JWT_SECRET:leadflow-local-dev-secret-key-32chars}
  expiration-ms: ${JWT_EXP_MS:900000}

server:
  port: ${PORT:8081}
